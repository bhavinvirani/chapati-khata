name: Feature request
description: Suggest an improvement to Chapati Khata.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app one shared tab behind a light name-based gate — no accounts, no per-user auth.
          required: true
        - label: This needs no new backend; the existing Supabase tables and edge function are enough.
          required: false
